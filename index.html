<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字法治·国安同行 — 网络安全普法闯关</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #06060f;
    color: #e0e0e0;
    font-family: 'Noto Sans SC', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(0,212,255,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(0,255,65,0.04) 0%, transparent 50%),
      linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
  }

  .container {
    width: 100%;
    max-width: 960px;
    padding: 20px;
  }

  /* ====== HEADER ====== */
  .header {
    text-align: center;
    margin-bottom: 18px;
  }
  .header .emblem {
    font-size: 42px;
    margin-bottom: 4px;
    filter: drop-shadow(0 0 18px rgba(0,212,255,0.5));
  }
  .header h1 {
    font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
    font-size: 28px;
    font-weight: 900;
    background: linear-gradient(135deg, #00d4ff 0%, #00ff41 50%, #00d4ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 3px;
  }
  .header .subtitle {
    font-size: 13px;
    color: #00d4ff88;
    letter-spacing: 6px;
    margin-top: 4px;
  }

  /* ====== MAIN GAME AREA ====== */
  .game-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .board-wrapper {
    flex: 0 0 auto;
    background: #0a0a1a;
    border: 1px solid #00d4ff22;
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 0 40px rgba(0,212,255,0.06), inset 0 0 60px rgba(0,0,0,0.3);
  }
  canvas {
    display: block;
    border-radius: 8px;
  }

  .sidebar {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 220px;
  }

  /* ====== PANELS ====== */
  .panel {
    background: #0d0d22;
    border: 1px solid #00d4ff22;
    border-radius: 14px;
    padding: 16px 18px;
  }
  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: #00d4ff88;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #ffffff08;
  }
  .stat-label { font-size: 13px; color: #888; }
  .stat-value {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 700;
    color: #00ff41;
  }
  .stat-value.lives { color: #ff4466; }
  .stat-value.progress { color: #00d4ff; }

  .progress-bar-outer {
    height: 6px;
    background: #ffffff0a;
    border-radius: 3px;
    margin-top: 6px;
    overflow: hidden;
  }
  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, #00d4ff, #00ff41);
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ====== DICE BUTTON ====== */
  .dice-btn {
    display: block;
    width: 100%;
    padding: 16px;
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #000;
    background: linear-gradient(135deg, #00ff41, #00d4ff);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .dice-btn:hover {
    box-shadow: 0 0 30px rgba(0,255,65,0.4), 0 0 60px rgba(0,212,255,0.3);
    transform: translateY(-2px);
  }
  .dice-btn:active { transform: scale(0.96); }
  .dice-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
    filter: grayscale(0.6);
  }

  .dice-label {
    text-align: center;
    font-size: 11px;
    color: #555;
    letter-spacing: 3px;
    margin-top: 6px;
  }

  /* ====== CELL LEGEND ====== */
  .legend { display:flex; flex-wrap:wrap; gap:8px; }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:11px; color:#888; }
  .legend-dot {
    width:12px; height:12px; border-radius:3px; flex-shrink:0;
  }

  /* ====== MODAL ====== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(6px);
    animation: fadeIn 0.2s ease;
  }
  .modal-overlay.hidden { display: none; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .modal-box {
    background: #0d0d28;
    border: 1px solid #00d4ff44;
    border-radius: 18px;
    padding: 28px 24px;
    max-width: 520px;
    width: 90%;
    box-shadow: 0 0 80px rgba(0,212,255,0.15);
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }

  .modal-badge {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .modal-badge.normal { background:#00d4ff22; color:#00d4ff; }
  .modal-badge.bonus { background:#b44dff22; color:#b44dff; }
  .modal-badge.boss { background:#ffd70022; color:#ffd700; }

  .modal-question {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.6;
    margin-bottom: 20px;
    color: #fff;
  }
  .modal-multiplier {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    color: #ffd700;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .answer-btn {
    display: block;
    width: 100%;
    padding: 13px 18px;
    margin-bottom: 8px;
    background: #151535;
    border: 1px solid #ffffff10;
    border-radius: 10px;
    color: #ccc;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .answer-btn:hover {
    background: #1a1a50;
    border-color: #00d4ff44;
    color: #fff;
  }
  .answer-btn.correct {
    background: #00ff4122 !important;
    border-color: #00ff41 !important;
    color: #00ff41 !important;
    animation: pulse 0.4s ease;
  }
  .answer-btn.wrong {
    background: #ff444422 !important;
    border-color: #ff4444 !important;
    color: #ff4444 !important;
    animation: shake 0.4s ease;
  }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.02); } }
  @keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }

  .feedback-text {
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    margin-top: 10px;
    min-height: 24px;
  }
  .feedback-text.right { color: #00ff41; }
  .feedback-text.wrong { color: #ff4444; }

  .continue-btn {
    display: block;
    margin: 14px auto 0;
    padding: 10px 32px;
    background: #00d4ff22;
    border: 1px solid #00d4ff44;
    border-radius: 8px;
    color: #00d4ff;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    transition: all 0.15s;
  }
  .continue-btn:hover { background: #00d4ff33; }

  /* ====== RESULT MODAL ====== */
  .result-icon { font-size: 64px; text-align: center; margin-bottom: 8px; }
  .result-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    text-align: center;
    letter-spacing: 4px;
  }
  .result-score { text-align: center; font-size: 48px; font-family: 'Orbitron', monospace; color:#00ff41; font-weight:900; }
  .result-detail { text-align: center; color: #888; font-size: 13px; margin: 10px 0; }
  .stars { text-align: center; font-size: 36px; letter-spacing: 8px; margin: 8px 0; }

  .restart-btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 16px;
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #000;
    background: linear-gradient(135deg, #00ff41, #00d4ff);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .restart-btn:hover {
    box-shadow: 0 0 30px rgba(0,255,65,0.4);
    transform: translateY(-2px);
  }

  /* ====== TOAST ====== */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 28px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 14px;
    z-index: 200;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
    pointer-events: none;
    letter-spacing: 1px;
  }
  .toast.trap { background: #ff446622; border: 1px solid #ff4466; color: #ff4466; }
  .toast.bonus { background: #b44dff22; border: 1px solid #b44dff; color: #b44dff; }
  .toast.safe { background: #4488ff22; border: 1px solid #4488ff; color: #4488ff; }
  .toast.boss { background: #ffd70022; border: 1px solid #ffd700; color: #ffd700; }
  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(-20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
  @keyframes toastOut { from { opacity:1; } to { opacity:0; } }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 780px) {
    .game-layout { flex-direction: column; align-items: center; }
    .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .sidebar .panel { flex: 1; min-width: 140px; }
    .header h1 { font-size: 20px; letter-spacing: 1px; }
    canvas { max-width: 100%; height: auto; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="emblem">🛡️</div>
    <h1>数字法治 · 国安同行</h1>
    <div class="subtitle">网络安全普法闯关挑战</div>
  </div>

  <div class="game-layout">
    <div class="board-wrapper">
      <canvas id="board" width="700" height="520"></canvas>
    </div>
    <div class="sidebar">
      <div class="panel">
        <div class="panel-title">📊 游戏状态</div>
        <div class="stat-row"><span class="stat-label">当前得分</span><span class="stat-value" id="scoreDisplay">0</span></div>
        <div class="stat-row"><span class="stat-label">剩余生命</span><span class="stat-value lives" id="livesDisplay">❤️❤️❤️</span></div>
        <div class="stat-row"><span class="stat-label">当前位置</span><span class="stat-value progress" id="posDisplay">0 / 24</span></div>
        <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
      </div>

      <div class="panel">
        <div class="panel-title">🎯 图例</div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:#00ff41;"></div>起点</div>
          <div class="legend-item"><div class="legend-dot" style="background:#ffd700;"></div>BOSS关卡</div>
          <div class="legend-item"><div class="legend-dot" style="background:#b44dff;"></div>双倍积分</div>
          <div class="legend-item"><div class="legend-dot" style="background:#ff4466;"></div>后退陷阱</div>
          <div class="legend-item"><div class="legend-dot" style="background:#4488ff;"></div>安全区</div>
        </div>
      </div>

      <button class="dice-btn" id="rollBtn" onclick="rollDice()">🎲 掷骰子</button>
      <div class="dice-label">骰子点数 1 - 3</div>
    </div>
  </div>
</div>

<!-- Question Modal -->
<div class="modal-overlay hidden" id="questionModal">
  <div class="modal-box">
    <div class="modal-badge" id="modalBadge">📋 普法问答</div>
    <div class="modal-multiplier hidden" id="modalMultiplier"></div>
    <div class="modal-question" id="modalQuestion"></div>
    <div id="answerButtons"></div>
    <div class="feedback-text" id="feedbackText"></div>
    <button class="continue-btn hidden" id="continueBtn" onclick="afterQuestion()">继 续</button>
  </div>
</div>

<!-- Result Modal -->
<div class="modal-overlay hidden" id="resultModal">
  <div class="modal-box">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-detail" id="resultDetail"></div>
    <button class="restart-btn" onclick="restartGame()">🔄 再来一局</button>
  </div>
</div>

<script>
// ==================== GAME CONFIGURATION ====================
const COLS = 5, ROWS = 5, TOTAL_CELLS = 25;
const CELL_W = 120, CELL_H = 85;
const GAP_X = 10, GAP_Y = 8;
const MARGIN_LEFT = 40, MARGIN_TOP = 45;
const FINISH_CELL = TOTAL_CELLS - 1; // 24

// Cell types: normal, start, boss, bonus, trap, safe
const CELL_TYPE = {
  START:  'start',
  BOSS:   'boss',
  BONUS:  'bonus',
  TRAP:   'trap',
  SAFE:   'safe',
  NORMAL: 'normal'
};

// Assign cell types for each of the 25 cells
const cellTypes = {};
cellTypes[0] = CELL_TYPE.START;
cellTypes[24] = CELL_TYPE.BOSS;
[3, 9, 15, 21].forEach(i => cellTypes[i] = CELL_TYPE.BONUS);
[5, 11, 17].forEach(i => cellTypes[i] = CELL_TYPE.TRAP);
[7, 13, 19].forEach(i => cellTypes[i] = CELL_TYPE.SAFE);
// Remaining are NORMAL

function getCellType(idx) { return cellTypes[idx] || CELL_TYPE.NORMAL; }

// ==================== QUESTION BANK ====================
const QUESTION_BANK = [
  { q: '《中华人民共和国网络安全法》自何时起施行？', opts: ['2017年6月1日','2018年1月1日','2016年12月1日','2019年5月1日'], ans: 0 },
  { q: '《中华人民共和国数据安全法》自何时起施行？', opts: ['2020年9月1日','2021年9月1日','2022年1月1日','2021年6月1日'], ans: 1 },
  { q: '《中华人民共和国个人信息保护法》自何时起施行？', opts: ['2021年6月1日','2021年9月1日','2021年11月1日','2022年1月1日'], ans: 2 },
  { q: '根据《网络安全法》，收集、使用个人信息应当遵循什么原则？', opts: ['公开、公平、公正','自愿、平等、诚信','合法、正当、必要','安全、保密、完整'], ans: 2 },
  { q: '关键信息基础设施运营者在中国境内收集的个人信息和重要数据，应当如何存储？', opts: ['可以存储在国外','应当在境内存储','必须加密后存储','可随意选择存储位置'], ans: 1 },
  { q: '《数据安全法》规定国家建立什么制度对数据实行保护？', opts: ['数据统一保护','数据分类分级保护','数据加密保护','数据备份保护'], ans: 1 },
  { q: '处理敏感个人信息应当取得个人的什么？', opts: ['口头同意','默认同意','单独同意','集体同意'], ans: 2 },
  { q: '网络运营者应当为公安机关、国家安全机关依法维护国家安全提供什么？', opts: ['资金支持','技术支持和协助','人员支持','设备支持'], ans: 1 },
  { q: '以下哪项不属于《个人信息保护法》规定的敏感个人信息？', opts: ['宗教信仰','生物识别信息','购物记录','医疗健康信息'], ans: 2 },
  { q: '《国家安全法》规定全民国家安全教育日是每年哪一天？', opts: ['4月15日','3月15日','6月1日','9月15日'], ans: 0 },
  { q: '发现网络产品存在安全缺陷时，网络运营者应立即采取什么措施？', opts: ['继续运营等待修复','补救措施并告知用户','隐瞒等待上级通知','出售业务撤离市场'], ans: 1 },
  { q: '关系国家安全、国民经济命脉等的数据属于什么？', opts: ['一般数据','重要数据','国家核心数据','公共数据'], ans: 2 },
  { q: '个人信息处理前，应以显著方式告知个人什么？', opts: ['公司简介','处理目的、方式和范围','员工信息','合作伙伴名单'], ans: 1 },
  { q: '网络运营者应按网络安全等级保护制度履行什么义务？', opts: ['纳税义务','安全保护义务','宣传义务','培训义务'], ans: 1 },
  { q: '使用网络不得从事危害什么的的活动？', opts: ['商业竞争','个人隐私','国家安全和社会公共利益','网络速度'], ans: 2 },
  { q: '个人对其个人信息处理享有什么权利？', opts: ['仅查阅权','知情权、决定权、查阅权、更正权、删除权等','仅删除权','没有任何权利'], ans: 1 },
  { q: '网络运营者应建立网络信息安全投诉、举报制度，这是哪部法律的规定？', opts: ['《民法典》','《网络安全法》','《合同法》','《消费者权益保护法》'], ans: 1 },
  { q: '利用个人信息进行自动化决策，应当保证什么？', opts: ['速度和效率','透明度和结果公平公正','算法复杂度','企业利润最大化'], ans: 1 },
  { q: '以下哪种行为违反《网络安全法》？', opts: ['设置密码保护','定期更新系统','非法出售个人信息','使用防火墙'], ans: 2 },
  { q: '《数据安全法》坚持以什么促进数据安全？', opts: ['技术发展','数据开发利用和产业发展','国际合作','政府管控'], ans: 1 },
  { q: '发生个人信息泄露，处理者应立即补救并通知哪个部门和个人？', opts: ['仅通知媒体','通知履职部门和个人','仅通知公安','仅内部处理'], ans: 1 },
  { q: '关键信息基础设施一旦遭到破坏可能严重危害什么？', opts: ['一般网络设施','国家安全和公共利益','办公效率','通信速度'], ans: 1 },
  { q: '维护国家安全应坚持什么原则？', opts: ['预防为主、标本兼治','打击为主','惩罚为主','民事赔偿为主'], ans: 0 },
  { q: '处理个人信息应具有明确合理目的，采取对个人权益影响最小的方式，这体现了什么原则？', opts: ['公开透明原则','最小必要原则','安全保护原则','诚实信用原则'], ans: 1 },
  { q: '《网络安全法》规定，网络运营者收集使用个人信息应当？', opts: ['可以超出约定范围','应当遵循合法正当必要原则','无需用户同意','可以随意共享'], ans: 1 },
  { q: '《个人信息保护法》赋予个人对其信息处理的什么权利？', opts: ['仅知情权','查阅复制权','知情决定权、限制拒绝权等','仅删除权'], ans: 2 },
  { q: '数据安全法中，开展数据处理活动应当依照什么规定？', opts: ['企业规章','行业惯例','法律法规','国际惯例'], ans: 2 },
  { q: '以下哪个属于关键信息基础设施保护范围？', opts: ['个人手机','家庭路由器','能源、交通、金融等','普通办公软件'], ans: 2 },
];

// ==================== GAME STATE ====================
let state = {
  playerPos: 0,
  score: 0,
  lives: 3,
  bonusMultiplier: 1,
  gameOver: false,
  usedQuestions: [],
  currentQuestion: null,
  animating: false
};

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

function cellCenter(idx) {
  const row = Math.floor(idx / COLS);
  let col = idx % COLS;
  if (row % 2 === 1) col = COLS - 1 - col;
  return {
    x: MARGIN_LEFT + col * (CELL_W + GAP_X) + CELL_W / 2,
    y: MARGIN_TOP + row * (CELL_H + GAP_Y) + CELL_H / 2
  };
}

function cellRect(idx) {
  const row = Math.floor(idx / COLS);
  let col = idx % COLS;
  if (row % 2 === 1) col = COLS - 1 - col;
  return {
    x: MARGIN_LEFT + col * (CELL_W + GAP_X),
    y: MARGIN_TOP + row * (CELL_H + GAP_Y),
    w: CELL_W,
    h: CELL_H
  };
}

// ==================== DRAWING ====================
const COLORS = {
  bg: '#060612',
  gridLine: '#ffffff05',
  path: '#00d4ff18',
  pathGlow: '#00d4ff08',
  cellNormal: '#111130',
  cellNormalBorder: '#00d4ff',
  cellStart: '#002211',
  cellStartBorder: '#00ff41',
  cellBoss: '#221100',
  cellBossBorder: '#ffd700',
  cellBonus: '#150525',
  cellBonusBorder: '#b44dff',
  cellTrap: '#220011',
  cellTrapBorder: '#ff4466',
  cellSafe: '#051525',
  cellSafeBorder: '#4488ff',
  player: '#00ff41',
  playerGlow: '#00ff4166',
  textDim: '#334',
  textBright: '#ccc',
};

function drawBackground() {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);

  // Decorative circuit lines
  ctx.strokeStyle = '#ffffff03';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 6; i++) {
    const x = 20 + i * 130;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x + 40, 60);
    ctx.lineTo(x - 20, 120);
    ctx.lineTo(x + 30, 200);
    ctx.lineTo(x, 280);
    ctx.lineTo(x + 50, 360);
    ctx.lineTo(x - 10, 440);
    ctx.lineTo(x + 20, 520);
    ctx.stroke();
  }
}

function drawPath() {
  // Draw connections between consecutive cells
  for (let i = 0; i < TOTAL_CELLS - 1; i++) {
    const from = cellCenter(i);
    const to = cellCenter(i + 1);

    // Glow layer
    ctx.strokeStyle = COLORS.pathGlow;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();

    // Main path
    ctx.strokeStyle = COLORS.path;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Arrow indicator
    const midX = (from.x + to.x) / 2;
    const midY = (from.y + to.y) / 2;
    const angle = Math.atan2(to.y - from.y, to.x - from.x);
    ctx.fillStyle = '#00d4ff44';
    ctx.beginPath();
    ctx.moveTo(midX, midY);
    ctx.lineTo(midX - 8 * Math.cos(angle - 0.6), midY - 8 * Math.sin(angle - 0.6));
    ctx.lineTo(midX - 8 * Math.cos(angle + 0.6), midY - 8 * Math.sin(angle + 0.6));
    ctx.closePath();
    ctx.fill();
  }
}

function getCellColors(type) {
  switch (type) {
    case CELL_TYPE.START:  return { fill: COLORS.cellStart, border: COLORS.cellStartBorder, icon: '🚩' };
    case CELL_TYPE.BOSS:   return { fill: COLORS.cellBoss, border: COLORS.cellBossBorder, icon: '👑' };
    case CELL_TYPE.BONUS:  return { fill: COLORS.cellBonus, border: COLORS.cellBonusBorder, icon: '✨' };
    case CELL_TYPE.TRAP:   return { fill: COLORS.cellTrap, border: COLORS.cellTrapBorder, icon: '⚠️' };
    case CELL_TYPE.SAFE:   return { fill: COLORS.cellSafe, border: COLORS.cellSafeBorder, icon: '🛡️' };
    default:              return { fill: COLORS.cellNormal, border: COLORS.cellNormalBorder, icon: null };
  }
}

function drawCell(idx) {
  const r = cellRect(idx);
  const type = getCellType(idx);
  const colors = getCellColors(type);

  // Glow
  const glow = ctx.createRadialGradient(r.x + r.w/2, r.y + r.h/2, r.w*0.3, r.x + r.w/2, r.y + r.h/2, r.w*0.9);
  glow.addColorStop(0, colors.border + '22');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(r.x - 8, r.y - 8, r.w + 16, r.h + 16);

  // Cell body
  const radius = 8;
  ctx.fillStyle = colors.fill;
  ctx.strokeStyle = colors.border;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(r.x + radius, r.y);
  ctx.lineTo(r.x + r.w - radius, r.y);
  ctx.quadraticCurveTo(r.x + r.w, r.y, r.x + r.w, r.y + radius);
  ctx.lineTo(r.x + r.w, r.y + r.h - radius);
  ctx.quadraticCurveTo(r.x + r.w, r.y + r.h, r.x + r.w - radius, r.y + r.h);
  ctx.lineTo(r.x + radius, r.y + r.h);
  ctx.quadraticCurveTo(r.x, r.y + r.h, r.x, r.y + r.h - radius);
  ctx.lineTo(r.x, r.y + radius);
  ctx.quadraticCurveTo(r.x, r.y, r.x + radius, r.y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Cell number (top-left small)
  ctx.fillStyle = colors.border;
  ctx.font = 'bold 10px Orbitron, monospace';
  ctx.textAlign = 'left';
  ctx.fillText(idx.toString().padStart(2, '0'), r.x + 6, r.y + 16);

  // Icon or type label
  if (colors.icon) {
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(colors.icon, r.x + r.w / 2, r.y + r.h / 2 + 6);
  } else {
    ctx.fillStyle = COLORS.textDim;
    ctx.font = '11px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('问答', r.x + r.w / 2, r.y + r.h / 2 + 4);
  }
}

function drawPlayer() {
  const pos = cellCenter(state.playerPos);
  const t = Date.now() / 1000;
  const pulse = 1 + 0.08 * Math.sin(t * 3);

  // Outer glow
  const glow = ctx.createRadialGradient(pos.x, pos.y, 6, pos.x, pos.y, 24 * pulse);
  glow.addColorStop(0, COLORS.playerGlow);
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 24 * pulse, 0, Math.PI * 2);
  ctx.fill();

  // Inner circle
  ctx.fillStyle = COLORS.player;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
  ctx.fill();

  // Shield symbol
  ctx.fillStyle = '#000';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⚖', pos.x, pos.y + 1);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawPath();

  // Draw all cells except player's current (player drawn on top)
  for (let i = 0; i < TOTAL_CELLS; i++) {
    drawCell(i);
  }

  drawPlayer();
}

// ==================== GAME LOGIC ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getRandomQuestion() {
  if (state.usedQuestions.length >= QUESTION_BANK.length) {
    state.usedQuestions = [];
  }
  const available = QUESTION_BANK
    .map((q, i) => ({ q, i }))
    .filter(({ i }) => !state.usedQuestions.includes(i));
  const pick = available[Math.floor(Math.random() * available.length)];
  state.usedQuestions.push(pick.i);
  return pick.q;
}

function updateUI() {
  document.getElementById('scoreDisplay').textContent = state.score;
  const hearts = ['🖤🖤🖤', '❤️🖤🖤', '❤️❤️🖤', '❤️❤️❤️'];
  document.getElementById('livesDisplay').textContent = hearts[state.lives];
  document.getElementById('posDisplay').textContent = `${state.playerPos} / ${FINISH_CELL}`;
  document.getElementById('progressBar').style.width = `${(state.playerPos / FINISH_CELL) * 100}%`;
}

function showModal(id) {
  document.getElementById(id).classList.remove('hidden');
}

function hideModal(id) {
  document.getElementById(id).classList.add('hidden');
}

async function animateMove(fromIdx, toIdx) {
  return new Promise(resolve => {
    const steps = [];
    if (fromIdx < toIdx) {
      for (let i = fromIdx; i <= toIdx; i++) steps.push(i);
    } else {
      for (let i = fromIdx; i >= toIdx; i--) steps.push(i);
    }

    let stepIdx = 0;
    const interval = setInterval(() => {
      if (stepIdx >= steps.length) {
        clearInterval(interval);
        resolve();
        return;
      }
      state.playerPos = steps[stepIdx];
      render();
      updateUI();
      stepIdx++;
    }, 180);
  });
}

async function rollDice() {
  if (state.animating || state.gameOver) return;
  state.animating = true;
  state.bonusMultiplier = 1;
  const btn = document.getElementById('rollBtn');
  btn.disabled = true;

  // Dice animation
  const diceEl = btn;
  const rollDuration = 600;
  const rollInterval = 60;
  const rolls = Math.floor(rollDuration / rollInterval);
  for (let i = 0; i < rolls; i++) {
    await new Promise(r => setTimeout(r, rollInterval));
    const temp = Math.floor(Math.random() * 3) + 1;
    diceEl.textContent = `🎲 ${temp}`;
  }

  const diceResult = Math.floor(Math.random() * 3) + 1;
  diceEl.textContent = `🎲 ${diceResult}`;

  // Calculate target position with bounce-back
  let target = state.playerPos + diceResult;
  if (target > FINISH_CELL) {
    const overshoot = target - FINISH_CELL;
    target = FINISH_CELL - overshoot;
  }
  if (target < 0) target = 0;

  // Animate player movement
  await animateMove(state.playerPos, target);
  state.playerPos = target;

  // Check cell type
  await handleCellLanding();

  diceEl.textContent = '🎲 掷骰子';
  btn.disabled = false;
  state.animating = false;
  updateUI();
}

function showToast(text, type) {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = text;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2200);
}

async function handleCellLanding() {
  const type = getCellType(state.playerPos);

  if (type === CELL_TYPE.START) {
    return;
  }

  if (type === CELL_TYPE.TRAP) {
    showToast('⚠️ 触发陷阱！后退 2 格', 'trap');
    await new Promise(r => setTimeout(r, 600));
    const target = Math.max(0, state.playerPos - 2);
    await animateMove(state.playerPos, target);
    state.playerPos = target;
    const newType = getCellType(state.playerPos);
    if (newType === CELL_TYPE.TRAP) {
      showToast('⚠️ 连环陷阱！再退 2 格', 'trap');
      await new Promise(r => setTimeout(r, 400));
      const target2 = Math.max(0, state.playerPos - 2);
      await animateMove(state.playerPos, target2);
      state.playerPos = target2;
    }
    updateUI();
    return;
  }

  if (type === CELL_TYPE.SAFE) {
    showToast('🛡️ 安全区，休息一下', 'safe');
    return;
  }

  if (type === CELL_TYPE.BONUS) {
    state.bonusMultiplier = 2;
    showToast('✨ 双倍积分区域！', 'bonus');
    await new Promise(r => setTimeout(r, 400));
  }
  if (type === CELL_TYPE.BOSS) {
    state.bonusMultiplier = 3;
    showToast('👑 BOSS 关卡！三倍积分', 'boss');
    await new Promise(r => setTimeout(r, 500));
  }

  showQuestion();
}

function showQuestion() {
  const type = getCellType(state.playerPos);
  const question = getRandomQuestion();
  state.currentQuestion = question;

  // Badge
  const badge = document.getElementById('modalBadge');
  badge.className = 'modal-badge';
  if (type === CELL_TYPE.BONUS) { badge.className += ' bonus'; badge.textContent = '✨ 双倍积分'; }
  else if (type === CELL_TYPE.BOSS) { badge.className += ' boss'; badge.textContent = '👑 BOSS 关卡'; }
  else { badge.className += ' normal'; badge.textContent = '📋 普法问答'; }

  // Multiplier
  const multEl = document.getElementById('modalMultiplier');
  if (state.bonusMultiplier > 1) {
    multEl.classList.remove('hidden');
    multEl.textContent = `🔥 ${state.bonusMultiplier}x 积分加成`;
  } else {
    multEl.classList.add('hidden');
  }

  // Question
  document.getElementById('modalQuestion').textContent = question.q;

  // Answer buttons
  const labels = ['A', 'B', 'C', 'D'];
  const container = document.getElementById('answerButtons');
  container.innerHTML = question.opts.map((opt, i) =>
    `<button class="answer-btn" onclick="selectAnswer(${i})" id="ansBtn${i}">
      <strong>${labels[i]}.</strong> ${opt}
    </button>`
  ).join('');

  document.getElementById('feedbackText').textContent = '';
  document.getElementById('feedbackText').className = 'feedback-text';
  document.getElementById('continueBtn').classList.add('hidden');

  showModal('questionModal');
}

function selectAnswer(choice) {
  if (!state.currentQuestion) return;

  const correct = state.currentQuestion.ans;
  const isRight = choice === correct;

  // Disable all buttons
  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById(`ansBtn${i}`);
    if (btn) btn.disabled = true;
  }

  // Highlight correct answer
  document.getElementById(`ansBtn${correct}`).classList.add('correct');

  // Highlight wrong choice if applicable
  if (!isRight) {
    document.getElementById(`ansBtn${choice}`).classList.add('wrong');
  }

  // Feedback
  const fb = document.getElementById('feedbackText');
  if (isRight) {
    const points = 10 * state.bonusMultiplier;
    state.score += points;
    fb.textContent = `✅ 回答正确！+${points} 分`;
    fb.className = 'feedback-text right';
  } else {
    state.lives--;
    fb.textContent = '❌ 回答错误！生命-1';
    fb.className = 'feedback-text wrong';
  }

  document.getElementById('continueBtn').classList.remove('hidden');
  updateUI();
}

function afterQuestion() {
  hideModal('questionModal');
  state.currentQuestion = null;
  state.bonusMultiplier = 1;

  if (state.lives <= 0) {
    endGame(false);
    return;
  }
  if (state.playerPos >= FINISH_CELL) {
    endGame(true);
    return;
  }
  updateUI();
}

function endGame(won) {
  state.gameOver = true;
  const icon = document.getElementById('resultIcon');
  const title = document.getElementById('resultTitle');
  const stars = document.getElementById('resultStars');
  const scoreEl = document.getElementById('resultScore');
  const detail = document.getElementById('resultDetail');

  if (won) {
    icon.textContent = '🏆';
    title.textContent = '通关成功！';
    title.style.color = '#ffd700';

    // Star rating
    if (state.lives === 3) stars.textContent = '⭐⭐⭐';
    else if (state.lives === 2) stars.textContent = '⭐⭐';
    else stars.textContent = '⭐';

    // Bonus for remaining lives
    const lifeBonus = state.lives * 20;
    state.score += lifeBonus;
    scoreEl.textContent = `${state.score} 分`;
    detail.textContent = `剩余生命加成 +${lifeBonus} 分 | 共回答 ${state.usedQuestions.length} 题`;
  } else {
    icon.textContent = '💔';
    title.textContent = '挑战失败';
    title.style.color = '#ff4466';
    stars.textContent = '';
    scoreEl.textContent = `${state.score} 分`;
    detail.textContent = '别灰心，再来一局吧！学习法律知识，守护数字安全！';
  }

  updateUI();
  document.getElementById('rollBtn').disabled = true;
  showModal('resultModal');
}

function restartGame() {
  hideModal('resultModal');
  hideModal('questionModal');
  state = {
    playerPos: 0,
    score: 0,
    lives: 3,
    bonusMultiplier: 1,
    gameOver: false,
    usedQuestions: [],
    currentQuestion: null,
    animating: false
  };
  document.getElementById('rollBtn').disabled = false;
  document.getElementById('rollBtn').textContent = '🎲 掷骰子';
  updateUI();
  render();
}

// ==================== INITIALIZATION ====================
function init() {
  updateUI();
  render();
  // Continuous render for player pulse animation
  function animLoop() {
    if (!state.animating) render();
    requestAnimationFrame(animLoop);
  }
  animLoop();
}

init();
</script>
